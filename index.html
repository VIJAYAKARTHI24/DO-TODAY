<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Today — Smart Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ===== DESIGN TOKENS ===== */
:root, [data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5;
  --color-border: #d4d1ca;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-active: #0f3638;
  --color-primary-highlight: #cedcd8;
  --color-error: #a12c7b;
  --color-error-highlight: #e0ced7;
  --color-warning: #964219;
  --color-warning-highlight: #ddcfc6;
  --color-success: #437a22;
  --color-success-highlight: #d4dfcc;
  --color-gold: #d19900;
  --color-gold-highlight: #e9e0c6;
  --color-blue: #006494;
  --color-blue-highlight: #c6d8e4;
  --color-purple: #7a39bb;
  --color-purple-highlight: #dacfde;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
}
[data-theme="dark"] {
  --color-bg: #171614;
  --color-surface: #1c1b19;
  --color-surface-2: #201f1d;
  --color-surface-offset: #1d1c1a;
  --color-surface-dynamic: #2d2c2a;
  --color-divider: #262523;
  --color-border: #393836;
  --color-text: #cdccca;
  --color-text-muted: #797876;
  --color-text-faint: #5a5957;
  --color-primary: #4f98a3;
  --color-primary-hover: #227f8b;
  --color-primary-active: #1a626b;
  --color-primary-highlight: #313b3b;
  --color-error: #d163a7;
  --color-error-highlight: #4c3d46;
  --color-warning: #bb653b;
  --color-warning-highlight: #564942;
  --color-success: #6daa45;
  --color-success-highlight: #3a4435;
  --color-gold: #e8af34;
  --color-gold-highlight: #4d4332;
  --color-blue: #5591c7;
  --color-blue-highlight: #3a4550;
  --color-purple: #a86fdf;
  --color-purple-highlight: #4e4652;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
}

/* ===== BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background: var(--color-bg);
  transition: background 300ms ease, color 300ms ease;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
a, button, [role="button"], input, textarea, select {
  transition: color var(--transition-interactive), background var(--transition-interactive),
              border-color var(--transition-interactive), box-shadow var(--transition-interactive),
              opacity var(--transition-interactive), transform var(--transition-interactive);
}

/* ===== LAYOUT ===== */
.app-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100dvh;
}
@media (max-width: 768px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 280px; }
  .mobile-overlay { display: block; }
}

/* ===== TOPBAR ===== */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-6);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; z-index: 40;
  box-shadow: var(--shadow-sm);
}
.logo {
  display: flex; align-items: center; gap: var(--space-2);
  font-family: var(--font-display);
  font-size: var(--text-lg);
  color: var(--color-text);
  text-decoration: none;
}
.logo-icon { color: var(--color-primary); }
.topbar-spacer { flex: 1; }
.topbar-search {
  display: flex; align-items: center; gap: var(--space-2);
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  padding: var(--space-2) var(--space-4);
  width: 260px;
}
.topbar-search input {
  background: none; border: none; outline: none;
  font-size: var(--text-sm); color: var(--color-text);
  width: 100%;
}
.topbar-search input::placeholder { color: var(--color-text-faint); }
.icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
}
.icon-btn:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.icon-btn:active { transform: scale(0.93); }
.hamburger { display: none; }
@media (max-width: 768px) {
  .hamburger { display: flex; }
  .topbar-search { display: none; }
}

/* ===== SIDEBAR ===== */
.sidebar {
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  padding: var(--space-6) var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-6);
  overflow-y: auto;
}
.sidebar-section-title {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  padding: 0 var(--space-3);
  margin-bottom: var(--space-2);
}
.nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  cursor: pointer;
  user-select: none;
  transition: all var(--transition-interactive);
}
.nav-item:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.nav-item.active { background: var(--color-primary-highlight); color: var(--color-primary); font-weight: 500; }
.nav-item .badge {
  margin-left: auto;
  background: var(--color-surface-dynamic);
  color: var(--color-text-muted);
  border-radius: var(--radius-full);
  padding: 2px 8px;
  font-size: var(--text-xs);
  font-weight: 600;
}
.nav-item.active .badge { background: var(--color-primary); color: #fff; }
.category-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}

/* ===== MAIN CONTENT ===== */
.main-content {
  display: flex; flex-direction: column;
  overflow-y: auto;
  padding: var(--space-8) var(--space-8);
  gap: var(--space-6);
  max-width: 800px;
}
@media (max-width: 768px) {
  .main-content { padding: var(--space-4); }
}

/* ===== PAGE HEADER ===== */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4);
}
.page-title { font-family: var(--font-display); font-size: var(--text-xl); line-height: 1.1; }
.page-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-1); }

/* ===== STATS ROW ===== */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4);
}
@media (max-width: 480px) { .stats-row { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
}
.stat-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  line-height: 1;
  color: var(--color-text);
  transition: all 400ms cubic-bezier(0.16, 1, 0.3, 1);
}
.stat-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
.stat-trend { font-size: var(--text-xs); margin-top: var(--space-2); font-weight: 500; }
.stat-trend.up { color: var(--color-success); }
.stat-trend.neutral { color: var(--color-text-faint); }

/* ===== ADD TASK FORM ===== */
.add-task-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: var(--space-4);
}
.add-task-input {
  background: var(--color-surface-offset);
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-base);
  color: var(--color-text);
  width: 100%;
  transition: all var(--transition-interactive);
}
.add-task-input:focus {
  outline: none;
  border-color: var(--color-primary);
  background: var(--color-surface-2);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-primary) 15%, transparent);
}
.add-task-input::placeholder { color: var(--color-text-faint); }
.task-meta-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.meta-select {
  appearance: none;
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-4) var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  cursor: pointer;
}
.meta-select:focus { outline: none; border-color: var(--color-primary); }
.meta-date {
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  cursor: pointer;
}
.meta-date:focus { outline: none; border-color: var(--color-primary); }
.add-btn {
  margin-left: auto;
  background: var(--color-primary);
  color: #fff;
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-5);
  font-size: var(--text-sm);
  font-weight: 600;
  display: flex; align-items: center; gap: var(--space-2);
  box-shadow: var(--shadow-sm);
}
.add-btn:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.add-btn:active { transform: translateY(0) scale(0.97); }

/* ===== FILTER BAR ===== */
.filter-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.filter-chip {
  padding: var(--space-1) var(--space-4);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  background: var(--color-surface-offset);
  color: var(--color-text-muted);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-interactive);
}
.filter-chip:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.filter-chip.active { background: var(--color-primary-highlight); color: var(--color-primary); border-color: color-mix(in oklch, var(--color-primary) 30%, transparent); }
.sort-select {
  margin-left: auto;
  appearance: none;
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-5) var(--space-1) var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  cursor: pointer;
}

/* ===== TASK LIST ===== */
.task-list { display: flex; flex-direction: column; gap: var(--space-2); }
.task-group-label {
  font-size: var(--text-xs); font-weight: 600;
  color: var(--color-text-faint);
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: var(--space-2) 0 var(--space-1);
  display: flex; align-items: center; gap: var(--space-2);
}
.task-group-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-divider);
}

.task-item {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-4) var(--space-5);
  display: flex; align-items: flex-start; gap: var(--space-4);
  box-shadow: var(--shadow-sm);
  animation: taskIn 250ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes taskIn {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.task-item:hover { box-shadow: var(--shadow-md); border-color: color-mix(in oklch, var(--color-primary) 25%, var(--color-border)); }
.task-item.completed { opacity: 0.55; }
.task-item.completed .task-title { text-decoration: line-through; color: var(--color-text-muted); }

/* Custom Checkbox */
.task-checkbox {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-full);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition-interactive);
  margin-top: 2px;
  background: transparent;
}
.task-checkbox:hover { border-color: var(--color-primary); background: var(--color-primary-highlight); }
.task-checkbox.checked {
  background: var(--color-primary);
  border-color: var(--color-primary);
}
.task-checkbox.checked::after {
  content: '';
  width: 5px; height: 9px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(42deg) translateY(-1px);
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: var(--text-base); font-weight: 500; word-break: break-word; line-height: 1.4; }
.task-desc { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: 2px; }

.task-footer { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }
.task-badge {
  padding: 2px var(--space-2);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
}
.task-date {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  display: flex; align-items: center; gap: 4px;
}
.task-date.overdue { color: var(--color-error); }

.task-actions { display: flex; align-items: flex-start; gap: var(--space-1); opacity: 0; transition: opacity var(--transition-interactive); }
.task-item:hover .task-actions { opacity: 1; }
.task-action-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); color: var(--color-text-faint); }
.task-action-btn:hover { background: var(--color-surface-dynamic); color: var(--color-text-muted); }
.task-action-btn.del:hover { background: var(--color-error-highlight); color: var(--color-error); }

/* Priority badges */
.priority-high   { background: var(--color-error-highlight);   color: var(--color-error);   }
.priority-medium { background: var(--color-warning-highlight); color: var(--color-warning); }
.priority-low    { background: var(--color-success-highlight); color: var(--color-success); }
.priority-none   { background: var(--color-surface-dynamic);   color: var(--color-text-faint); }

/* Category badges */
.cat-work     { background: var(--color-blue-highlight);   color: var(--color-blue);   }
.cat-personal { background: var(--color-purple-highlight); color: var(--color-purple); }
.cat-health   { background: var(--color-success-highlight);color: var(--color-success);}
.cat-study    { background: var(--color-gold-highlight);   color: var(--color-gold);   }
.cat-other    { background: var(--color-surface-dynamic);  color: var(--color-text-faint); }

/* ===== EMPTY STATE ===== */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: var(--space-12) var(--space-8);
  color: var(--color-text-muted);
}
.empty-state-icon {
  width: 56px; height: 56px;
  color: var(--color-text-faint);
  margin-bottom: var(--space-4);
  animation: floatIcon 3s ease-in-out infinite;
}
@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.empty-state h3 { color: var(--color-text); font-size: var(--text-lg); margin-bottom: var(--space-2); }
.empty-state p { max-width: 32ch; font-size: var(--text-sm); line-height: 1.6; }

/* ===== EDIT MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: oklch(0.1 0 0 / 0.5);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: var(--space-4);
  opacity: 0; pointer-events: none;
  transition: opacity 220ms ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow-lg);
  transform: translateY(12px) scale(0.97);
  transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease;
  opacity: 0;
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); opacity: 1; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); }
.modal-title { font-family: var(--font-display); font-size: var(--text-lg); }
.modal-close { color: var(--color-text-muted); }
.modal-close:hover { color: var(--color-text); }
.form-group { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
.form-label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); }
.form-input {
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm);
  color: var(--color-text);
  width: 100%;
}
.form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-primary) 15%, transparent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.modal-actions { display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6); }
.btn-ghost {
  padding: var(--space-2) var(--space-5);
  border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 500;
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
}
.btn-ghost:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.btn-primary {
  padding: var(--space-2) var(--space-5);
  border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  background: var(--color-primary);
  color: #fff;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { transform: scale(0.97); }

/* ===== PROGRESS BAR ===== */
.progress-wrap { display: flex; align-items: center; gap: var(--space-3); }
.progress-bar-track {
  flex: 1; height: 6px;
  background: var(--color-surface-dynamic);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--color-primary);
  border-radius: var(--radius-full);
  transition: width 500ms cubic-bezier(0.16, 1, 0.3, 1);
}
.progress-pct { font-size: var(--text-xs); font-weight: 600; color: var(--color-primary); min-width: 2.5ch; }

/* ===== MOBILE OVERLAY ===== */
.mobile-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 49;
  background: oklch(0 0 0 / 0.4);
}

/* ===== TOAST ===== */
.toast-container {
  position: fixed; bottom: var(--space-6); right: var(--space-6);
  z-index: 200; display: flex; flex-direction: column; gap: var(--space-2);
  pointer-events: none;
}
.toast {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-5);
  font-size: var(--text-sm);
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: var(--space-2);
  pointer-events: auto;
  animation: toastIn 300ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(16px) scale(0.96); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateX(16px) scale(0.96); }
}
.toast.removing { animation: toastOut 200ms ease forwards; }
</style>
</head>
<body>

<div class="app-layout">
  <!-- TOP BAR -->
  <header class="topbar">
    <button class="icon-btn hamburger" id="hamburger-btn" aria-label="Toggle menu">
      <i data-lucide="menu" width="18" height="18"></i>
    </button>
    <a class="logo" href="#">
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Do Today logo">
        <rect x="3" y="3" width="10" height="10" rx="3" fill="currentColor" opacity="0.9"/>
        <rect x="15" y="3" width="10" height="10" rx="3" fill="currentColor" opacity="0.5"/>
        <rect x="3" y="15" width="10" height="10" rx="3" fill="currentColor" opacity="0.5"/>
        <rect x="15" y="15" width="10" height="10" rx="3" fill="currentColor" opacity="0.2"/>
      </svg>
      Do Today
    </a>
    <div class="topbar-search">
      <i data-lucide="search" width="14" height="14" style="color:var(--color-text-faint);flex-shrink:0"></i>
      <input type="text" placeholder="Search tasks…" id="search-input" autocomplete="off">
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" data-theme-toggle>
      <i data-lucide="sun" width="18" height="18"></i>
    </button>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div>
      <p class="sidebar-section-title">Views</p>
      <div class="nav-item active" data-filter="all">
        <i data-lucide="layout-list" width="16" height="16"></i>
        All Tasks <span class="badge" id="badge-all">0</span>
      </div>
      <div class="nav-item" data-filter="today">
        <i data-lucide="sun" width="16" height="16"></i>
        Today <span class="badge" id="badge-today">0</span>
      </div>
      <div class="nav-item" data-filter="upcoming">
        <i data-lucide="calendar" width="16" height="16"></i>
        Upcoming <span class="badge" id="badge-upcoming">0</span>
      </div>
      <div class="nav-item" data-filter="completed">
        <i data-lucide="check-circle" width="16" height="16"></i>
        Completed <span class="badge" id="badge-completed">0</span>
      </div>
    </div>
    <div>
      <p class="sidebar-section-title">Categories</p>
      <div class="nav-item" data-filter="cat-work">
        <span class="category-dot" style="background:var(--color-blue)"></span>
        Work <span class="badge" id="badge-work">0</span>
      </div>
      <div class="nav-item" data-filter="cat-personal">
        <span class="category-dot" style="background:var(--color-purple)"></span>
        Personal <span class="badge" id="badge-personal">0</span>
      </div>
      <div class="nav-item" data-filter="cat-health">
        <span class="category-dot" style="background:var(--color-success)"></span>
        Health <span class="badge" id="badge-health">0</span>
      </div>
      <div class="nav-item" data-filter="cat-study">
        <span class="category-dot" style="background:var(--color-gold)"></span>
        Study <span class="badge" id="badge-study">0</span>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main-content" id="main-content">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title" id="page-title">All Tasks</h1>
        <p class="page-subtitle" id="page-subtitle">Manage and track your tasks</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Tasks</div>
        <div class="stat-trend neutral" id="stat-total-trend">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-label">Completed</div>
        <div class="stat-trend up" id="stat-done-trend"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
        <div class="stat-trend neutral" id="stat-pending-trend"></div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <span style="font-size:var(--text-xs);color:var(--color-text-muted);white-space:nowrap">Progress</span>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>

    <!-- Add Task -->
    <div class="add-task-card">
      <input class="add-task-input" type="text" id="task-input" placeholder="Add a new task… press Enter or click Add" autocomplete="off">
      <div class="task-meta-row">
        <select class="meta-select" id="task-priority">
          <option value="none">No priority</option>
          <option value="high">🔴 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
        <select class="meta-select" id="task-category">
          <option value="other">📁 Other</option>
          <option value="work">💼 Work</option>
          <option value="personal">🏠 Personal</option>
          <option value="health">💪 Health</option>
          <option value="study">📚 Study</option>
        </select>
        <input type="date" class="meta-date" id="task-due">
        <button class="add-btn" id="add-btn">
          <i data-lucide="plus" width="14" height="14"></i> Add Task
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-chip active" data-status="all">All</button>
      <button class="filter-chip" data-status="active">Active</button>
      <button class="filter-chip" data-status="completed">Completed</button>
      <button class="filter-chip" data-status="high">🔴 High</button>
      <button class="filter-chip" data-status="overdue">⚠️ Overdue</button>
      <select class="sort-select" id="sort-select">
        <option value="created">Newest first</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
        <option value="alpha">A–Z</option>
      </select>
    </div>

    <!-- Task List -->
    <div class="task-list" id="task-list"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Edit task">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 class="modal-title">Edit Task</h2>
      <button class="icon-btn modal-close" id="modal-close-btn" aria-label="Close modal">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label" for="edit-title">Task title</label>
      <input class="form-input" type="text" id="edit-title" placeholder="What needs to be done?">
    </div>
    <div class="form-group">
      <label class="form-label" for="edit-desc">Description (optional)</label>
      <input class="form-input" type="text" id="edit-desc" placeholder="Add details…">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-priority">Priority</label>
        <select class="form-input" id="edit-priority">
          <option value="none">None</option>
          <option value="high">🔴 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-category">Category</label>
        <select class="form-input" id="edit-category">
          <option value="other">📁 Other</option>
          <option value="work">💼 Work</option>
          <option value="personal">🏠 Personal</option>
          <option value="health">💪 Health</option>
          <option value="study">📚 Study</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="edit-due">Due date</label>
      <input class="form-input" type="date" id="edit-due">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modal-cancel-btn">Cancel</button>
      <button class="btn-primary" id="modal-save-btn">Save changes</button>
    </div>
  </div>
</div>

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" id="mobile-overlay"></div>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<script>
/* ======= THEME TOGGLE ======= */
(function(){
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  let theme = 'dark';
  root.setAttribute('data-theme', theme);
  function updateIcon(){
    toggle.innerHTML = theme === 'dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  updateIcon();
  toggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    updateIcon();
  });
})();

/* ======= LUCIDE ICONS ======= */
document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

/* ======= STATE ======= */
let tasks = [
  { id: 1, title: 'Review NPTEL lecture notes', desc: 'Focus on microprocessor architecture', priority: 'high', category: 'study', due: '', completed: false, created: Date.now() - 86400000 },
  { id: 2, title: 'Submit assignment on TCP/IP protocols', desc: '', priority: 'high', category: 'study', due: getTodayStr(), completed: false, created: Date.now() - 3600000 },
  { id: 3, title: 'Morning workout', desc: '30 min run + stretching', priority: 'medium', category: 'health', due: getTodayStr(), completed: true, created: Date.now() - 7200000 },
  { id: 4, title: 'Research AI-powered cybersecurity threats', desc: 'For seminar presentation', priority: 'medium', category: 'study', due: '', completed: false, created: Date.now() - 2000000 },
  { id: 5, title: 'Buy groceries', desc: '', priority: 'low', category: 'personal', due: '', completed: false, created: Date.now() - 900000 },
];
let nextId = 6;
let activeNavFilter = 'all';
let activeStatusFilter = 'all';
let searchQuery = '';
let sortBy = 'created';
let editingId = null;

function getTodayStr(){
  const d = new Date();
  return d.toISOString().split('T')[0];
}
function formatDate(str){
  if (!str) return '';
  const [y,m,day] = str.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m,10)-1]} ${parseInt(day,10)}`;
}
function isOverdue(task){
  if (!task.due || task.completed) return false;
  return task.due < getTodayStr();
}
function isToday(task){
  return task.due === getTodayStr();
}

/* ======= FILTER & SORT ======= */
function getFilteredTasks(){
  let list = [...tasks];
  // Nav filter
  if (activeNavFilter === 'today') list = list.filter(t => isToday(t));
  else if (activeNavFilter === 'upcoming') list = list.filter(t => t.due && t.due > getTodayStr() && !t.completed);
  else if (activeNavFilter === 'completed') list = list.filter(t => t.completed);
  else if (activeNavFilter.startsWith('cat-')) list = list.filter(t => t.category === activeNavFilter.replace('cat-',''));
  // Status filter
  if (activeStatusFilter === 'active') list = list.filter(t => !t.completed);
  else if (activeStatusFilter === 'completed') list = list.filter(t => t.completed);
  else if (activeStatusFilter === 'high') list = list.filter(t => t.priority === 'high');
  else if (activeStatusFilter === 'overdue') list = list.filter(t => isOverdue(t));
  // Search
  if (searchQuery) list = list.filter(t => t.title.toLowerCase().includes(searchQuery) || (t.desc||'').toLowerCase().includes(searchQuery));
  // Sort
  if (sortBy === 'due') list.sort((a,b) => { if(!a.due) return 1; if(!b.due) return -1; return a.due.localeCompare(b.due); });
  else if (sortBy === 'priority') { const p = {high:0,medium:1,low:2,none:3}; list.sort((a,b) => p[a.priority]-p[b.priority]); }
  else if (sortBy === 'alpha') list.sort((a,b) => a.title.localeCompare(b.title));
  else list.sort((a,b) => b.created - a.created);
  return list;
}

/* ======= RENDER ======= */
function render(){
  updateStats();
  updateBadges();
  renderTasks();
  lucide.createIcons();
}

function updateStats(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.completed).length;
  const pending = total - done;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-pending').textContent = pending;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('stat-done-trend').textContent = total ? `${pct}% completion rate` : '—';
  document.getElementById('stat-pending-trend').textContent = pending ? `${pending} left to do` : '🎉 All done!';
}

function updateBadges(){
  const today = getTodayStr();
  document.getElementById('badge-all').textContent = tasks.length;
  document.getElementById('badge-today').textContent = tasks.filter(t=>t.due===today && !t.completed).length;
  document.getElementById('badge-upcoming').textContent = tasks.filter(t=>t.due>today && !t.completed).length;
  document.getElementById('badge-completed').textContent = tasks.filter(t=>t.completed).length;
  document.getElementById('badge-work').textContent = tasks.filter(t=>t.category==='work' && !t.completed).length;
  document.getElementById('badge-personal').textContent = tasks.filter(t=>t.category==='personal' && !t.completed).length;
  document.getElementById('badge-health').textContent = tasks.filter(t=>t.category==='health' && !t.completed).length;
  document.getElementById('badge-study').textContent = tasks.filter(t=>t.category==='study' && !t.completed).length;
}

function renderTasks(){
  const list = getFilteredTasks();
  const container = document.getElementById('task-list');
  if (!list.length){
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon"><i data-lucide="inbox" width="56" height="56"></i></div>
        <h3>No tasks found</h3>
        <p>Add a new task above or try adjusting your filters.</p>
      </div>`;
    lucide.createIcons();
    return;
  }
  // Group: pending vs completed
  const pending = list.filter(t=>!t.completed);
  const done = list.filter(t=>t.completed);
  let html = '';
  if (pending.length){
    if (done.length) html += `<div class="task-group-label">Active (${pending.length})</div>`;
    pending.forEach(t => { html += taskItemHTML(t); });
  }
  if (done.length){
    html += `<div class="task-group-label">Completed (${done.length})</div>`;
    done.forEach(t => { html += taskItemHTML(t); });
  }
  container.innerHTML = html;
  // Bind events
  container.querySelectorAll('.task-checkbox').forEach(cb => {
    cb.addEventListener('click', () => toggleTask(parseInt(cb.dataset.id)));
  });
  container.querySelectorAll('.task-action-btn.edit').forEach(b => {
    b.addEventListener('click', () => openEdit(parseInt(b.dataset.id)));
  });
  container.querySelectorAll('.task-action-btn.del').forEach(b => {
    b.addEventListener('click', () => deleteTask(parseInt(b.dataset.id)));
  });
  lucide.createIcons();
}

function taskItemHTML(t){
  const overdue = isOverdue(t);
  const today = isToday(t);
  return `
  <div class="task-item ${t.completed?'completed':''}" data-id="${t.id}">
    <button class="task-checkbox ${t.completed?'checked':''}" data-id="${t.id}" aria-label="Toggle task complete" role="checkbox" aria-checked="${t.completed}"></button>
    <div class="task-body">
      <div class="task-title">${escapeHtml(t.title)}</div>
      ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ''}
      <div class="task-footer">
        ${t.priority !== 'none' ? `<span class="task-badge priority-${t.priority}">${t.priority.charAt(0).toUpperCase()+t.priority.slice(1)}</span>` : ''}
        ${t.category !== 'other' ? `<span class="task-badge cat-${t.category}">${t.category.charAt(0).toUpperCase()+t.category.slice(1)}</span>` : ''}
        ${t.due ? `<span class="task-date ${overdue?'overdue':''}"><i data-lucide="calendar" width="11" height="11"></i>${today?'Today':formatDate(t.due)}${overdue?' · Overdue':''}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-action-btn edit" data-id="${t.id}" aria-label="Edit task"><i data-lucide="pencil" width="13" height="13"></i></button>
      <button class="task-action-btn del" data-id="${t.id}" aria-label="Delete task"><i data-lucide="trash-2" width="13" height="13"></i></button>
    </div>
  </div>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ======= ACTIONS ======= */
function addTask(){
  const input = document.getElementById('task-input');
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  const task = {
    id: nextId++,
    title,
    desc: '',
    priority: document.getElementById('task-priority').value,
    category: document.getElementById('task-category').value,
    due: document.getElementById('task-due').value,
    completed: false,
    created: Date.now(),
  };
  tasks.unshift(task);
  input.value = '';
  document.getElementById('task-priority').value = 'none';
  document.getElementById('task-category').value = 'other';
  document.getElementById('task-due').value = '';
  render();
  toast('Task added ✓', 'success');
}

function toggleTask(id){
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  t.completed = !t.completed;
  render();
  if (t.completed) toast('Task completed 🎉', 'success');
}

function deleteTask(id){
  const idx = tasks.findIndex(t=>t.id===id);
  if (idx < 0) return;
  tasks.splice(idx, 1);
  render();
  toast('Task deleted', 'neutral');
}

/* ======= EDIT MODAL ======= */
function openEdit(id){
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  editingId = id;
  document.getElementById('edit-title').value = t.title;
  document.getElementById('edit-desc').value = t.desc||'';
  document.getElementById('edit-priority').value = t.priority;
  document.getElementById('edit-category').value = t.category;
  document.getElementById('edit-due').value = t.due||'';
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('edit-title').focus();
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}
function saveEdit(){
  if (!editingId) return;
  const t = tasks.find(t=>t.id===editingId);
  if (!t) return;
  const title = document.getElementById('edit-title').value.trim();
  if (!title) return;
  t.title = title;
  t.desc = document.getElementById('edit-desc').value.trim();
  t.priority = document.getElementById('edit-priority').value;
  t.category = document.getElementById('edit-category').value;
  t.due = document.getElementById('edit-due').value;
  closeModal();
  render();
  toast('Task updated ✓', 'success');
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
document.getElementById('modal-save-btn').addEventListener('click', saveEdit);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('edit-title').addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') closeModal(); });

/* ======= TOAST ======= */
function toast(msg, type='neutral'){
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
  const color = type === 'success' ? 'var(--color-success)' : type === 'error' ? 'var(--color-error)' : 'var(--color-text-muted)';
  el.innerHTML = `<i data-lucide="${icon}" width="15" height="15" style="color:${color};flex-shrink:0"></i><span>${msg}</span>`;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 200);
  }, 2500);
}

/* ======= NAV ======= */
document.querySelectorAll('.nav-item[data-filter]').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    activeNavFilter = item.dataset.filter;
    const titles = {all:'All Tasks',today:'Today',upcoming:'Upcoming',completed:'Completed','cat-work':'Work','cat-personal':'Personal','cat-health':'Health','cat-study':'Study'};
    document.getElementById('page-title').textContent = titles[activeNavFilter]||'Tasks';
    closeSidebar();
    render();
  });
});

/* ======= STATUS FILTERS ======= */
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeStatusFilter = chip.dataset.status;
    render();
  });
});

/* ======= SORT ======= */
document.getElementById('sort-select').addEventListener('change', e => {
  sortBy = e.target.value;
  render();
});

/* ======= SEARCH ======= */
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  render();
});

/* ======= ADD ======= */
document.getElementById('add-btn').addEventListener('click', addTask);
document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

/* ======= MOBILE SIDEBAR ======= */
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').style.display = '';
}
document.getElementById('hamburger-btn').addEventListener('click', () => {
  const s = document.getElementById('sidebar');
  const isOpen = s.classList.toggle('open');
  document.getElementById('mobile-overlay').style.display = isOpen ? 'block' : '';
});
document.getElementById('mobile-overlay').addEventListener('click', closeSidebar);

/* ======= INIT ======= */
render();
</script>
</body>
</html>
